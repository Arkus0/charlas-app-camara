<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080510" />
    <meta name="description" content="Clavel Negro: action RPG de aventura con estética de 16 bits. Drama criminal en la costa de Levante, verano de 1999." />
    <title>Clavel Negro</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <style>
      /* Una sola pantalla oscura: el lienzo del juego centrado y, en táctil, los mandos en los márgenes. */
      :root {
        color-scheme: dark;
        --fondo: #080510; --mando: #1a1630; --mando-centro: #2a2444; --mando-borde: #4a4470; --cruz: #6a64a0; --texto: #ffffff;
        --golpe: #b02848; --salto: #2860b0; --objeto: #2c8a50; --cambio: #80702c; --pausa: #3a3458;
        --izq: max(16px, env(safe-area-inset-left, 0px)); --der: max(16px, env(safe-area-inset-right, 0px));
      }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--fondo); color: var(--texto); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; box-sizing: border-box;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      canvas { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--fondo); }
      #tactil { display: none; position: fixed; inset: 0; pointer-events: none; }
      .tactil #tactil { display: block; }
      #tactil > * { pointer-events: auto; position: absolute; }
      [data-cruz] { left: var(--izq); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, var(--mando-centro) 0 30%, var(--mando) 31% 100%); border: 2px solid var(--mando-borde); box-sizing: border-box; opacity: 0.8; }
      [data-cruz]::before, [data-cruz]::after { content: ''; position: absolute; background: var(--cruz); border-radius: 4px; }
      [data-cruz]::before { left: 50%; top: 12px; bottom: 12px; width: 30px; margin-left: -15px; }
      [data-cruz]::after { top: 50%; left: 12px; right: 12px; height: 30px; margin-top: -15px; }
      .boton { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--mando-borde); box-sizing: border-box; color: var(--texto); font: bold 11px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; opacity: 0.8; text-align: center; line-height: 1.05; }
      .boton.pulsado { filter: brightness(1.6); transform: scale(0.94); }
      [data-boton='a'] { right: var(--der); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); background: var(--golpe); }
      [data-boton='b'] { right: calc(var(--der) + 62px); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--salto); }
      [data-boton='c'] { right: calc(var(--der) + 62px); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--objeto); }
      [data-boton='d'] { right: var(--der); bottom: calc(136px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; background: var(--cambio); font-size: 9px; }
      [data-boton='e'] { right: var(--der); top: calc(12px + env(safe-area-inset-top, 0px)); width: 62px; height: 28px; border-radius: 14px; background: var(--pausa); font-size: 10px; }
      @media (orientation: portrait) {
        body { align-items: flex-start; }
        canvas { margin-top: 8px; }
        [data-boton='e'] { top: auto; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
      }
    </style>
  </head>
  <body>
    <canvas id="pantalla" width="256" height="224"></canvas>
    <div id="tactil">
      <div data-cruz></div>
      <div class="boton" data-boton="a">GOLPE</div>
      <div class="boton" data-boton="b">SALTO</div>
      <div class="boton" data-boton="c">OBJ</div>
      <div class="boton" data-boton="d">CAMB</div>
      <div class="boton" data-boton="e">PAUSA</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
